# Локально: только БД (Postgres, Neo4j, Chroma). AI/API — в IDE на хосте.
# Запуск: docker compose --env-file .env.local up -d
# Полный стек с ai-service: docker-compose.dev.yml

services:
  postgres:    image: postgres:15-alpine
    container_name: delez_ai_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C.UTF-8"
      POSTGRES_SHARED_BUFFERS: "256MB"
      POSTGRES_EFFECTIVE_CACHE_SIZE: "1GB"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - delez_ai_infrastructure
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========== БАЗЫ ДАННЫХ ==========

  neo4j:
    image: neo4j:5.15.0
    container_name: delez_ai_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
      - "2004:2004"   # Prometheus metrics endpoint
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
      NEO4J_metrics_enabled: "true"
      NEO4J_metrics_prometheus_enabled: "true"
      NEO4J_metrics_prometheus_endpoint: "0.0.0.0:2004"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
    networks:
      - delez_ai_infrastructure
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: delez_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - delez_ai_infrastructure
    depends_on:
      postgres:
        condition: service_healthy

  chroma:
    image: chromadb/chroma:latest
    container_name: delez_ai_chroma
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: "/chroma/chroma"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - delez_ai_infrastructure
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
    name: delez_ai_postgres_data

  neo4j_data:
    driver: local
    name: delez_ai_neo4j_data
  neo4j_logs:
    driver: local
    name: delez_ai_neo4j_logs
  neo4j_import:
    driver: local
    name: delez_ai_neo4j_import
  neo4j_plugins:
    driver: local
    name: delez_ai_neo4j_plugins
  chroma_data:
    driver: local
    name: delez_ai_chroma_data

networks:
  delez_ai_infrastructure:
    name: delez_ai_infrastructure
    driver: bridge
